# A deliberately small rule set, carried from the predecessor's 2026-09-15 review. Every department
# is off except Layout; the other cops below are the ones enabled, and widening the list is a separate
# decision. Ed enabled the whole Layout department on 2026-10-01 (planning/archive/rubocop-layout.md).
# There is no burn-down register: this repository starts at the ceilings, so every file is held.

AllCops:
  DisabledByDefault: true
  TargetRubyVersion: 2.7
  SuggestExtensions: false
  Exclude:
    # `_private/` is the gitignored corpus and `vendor/` is other people's code. `planning/` holds
    # retained evidence probes, which are records rather than code. `syntax` in the Makefile and the
    # pre-commit hook (`RUBY_ROOTS`) draw the same boundary: src, tests and tools.
    - "_private/**/*"
    - "planning/**/*"
    - "vendor/**/*"
    - "src/ph_composer/vendor/**/*"
    - "tests/fixtures/**/*"

Style/FrozenStringLiteralComment:
  Enabled: true

Style/Semicolon:
  Enabled: true

# Every Layout cop. Where a cop offers several styles, the one chosen is the style the code already
# followed most when the department was enabled, so the formatting pass moved the fewest lines.
Layout:
  Enabled: true

# Explicit opt-ins for pending Layout cops; the whole department includes them.
Layout/EmptyLinesAfterModuleInclusion:
  Enabled: true

Layout/LineContinuationLeadingSpace:
  Enabled: true

Layout/LineContinuationSpacing:
  Enabled: true

Layout/LineEndStringConcatenationIndentation:
  Enabled: true

Layout/SpaceBeforeBrackets:
  Enabled: true

# context/CODING_STANDARDS.md "Line and size limits": 120, including transplanted code.
Layout/LineLength:
  Enabled: true
  Max: 120
  # The upgrade's new qualified-name exemption must not relax the existing ceiling.
  AllowQualifiedName: false

# Keys align with the first key, for `:key => value` and `key: value` alike, including a trailing
# hash argument without braces. Where that first key would push a line past 120, it starts its own
# line under the call's first argument.
Layout/HashAlignment:
  EnforcedHashRocketStyle: key
  EnforcedColonStyle: key

# A continued argument list or array lines up with its first element.
Layout/ArgumentAlignment:
  EnforcedStyle: with_first_argument

Layout/ArrayAlignment:
  EnforcedStyle: with_first_element

# A first element on its own line is indented one step from the line that opens it, inside
# parentheses or not.
Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

# A continued method chain or operation lines up with its first operand.
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: aligned

Layout/MultilineOperationIndentation:
  EnforcedStyle: aligned

Layout/EndAlignment:
  EnforcedStyleAlignWith: keyword

# Size limits are review signals, not a reason to fragment a cohesive operation. A justified local
# exception says why the longer unit is easier to understand.
Metrics/MethodLength:
  Enabled: true
  Max: 40

Metrics/ClassLength:
  Enabled: true
  Max: 300
  # A test class is one scenario file, not a unit of production design.
  Exclude:
    - "tests/**/*_test.rb"
