[project]
name = "ph-composer-dev"
version = "0.0.0"
description = "PH-Composer development tooling and its tests. Nothing here ships."
# Pyodide 0.24.1 embeds CPython 3.11.3, and the translation package this project will also type
# check runs there. Tooling pins the same interpreter so both are checked on one version.
requires-python = "==3.11.*"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
# Each tool script is a `uv run` entry point with its own PEP 723 block, so it is importable by
# module name only through these entries.
pythonpath = ["tools/rbz", "tools/hostkit", "tools/runtime", "src/ph_composer/python", "tests/python"]

[tool.ruff]
line-length = 120
src = [".", "tools/rbz", "tools/hostkit", "tools/runtime", "src/ph_composer/python", "tests/python"]

# The pycodestyle/pyflakes core, import order, the modernizations 3.11 makes free, and three
# families carried from the predecessor's review: `BLE` makes a broad `except` a decision,
# `RUF100` keeps a `noqa` from outliving its rule.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]
# `×` and `−` are the domain's notation (context/UBIQUITOUS_LANGUAGE.md), not typos for x and -.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src/ph_composer/python", "tools/rbz", "tools/hostkit", "tools/runtime", "tests/python"]
mypy_path = "src/ph_composer/python:tools/rbz:tools/hostkit:tools/runtime:tests/python"
disallow_untyped_defs = true
