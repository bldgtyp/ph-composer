[project]
name = "ph-composer-dev"
version = "0.0.0"
description = "PH-Composer development tooling and its tests. Nothing here ships."
# Pyodide 0.24.1 embeds CPython 3.11.3, and the translation package this project will also type
# check runs there. Tooling pins the same interpreter so both are checked on one version.
requires-python = "==3.11.*"
dependencies = [
    "ladybug-geometry==1.35.3",
    "ladybug-geometry-polyskel==1.7.52",
    "ladybug-core==0.44.56",
    "honeybee-standards==2.0.7",
    "honeybee-core==1.64.65",
    "honeybee-energy==1.123.23",
    "ph-units==1.5.38",
    "honeybee-ph==1.33.65",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "ty==0.0.87"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
# Each tool script is a `uv run` entry point with its own PEP 723 block, so it is importable by
# module name only through these entries. The shipped translation package, the synthetic sections and
# the development example's sections are imported the same way.
pythonpath = [
    "tools/rbz", "tools/hostkit", "tools/runtime", "src/ph_composer/python", "tests/python", "tools/examples/foundation",
    "tools/githooks",
]

[tool.ruff]
line-length = 120
src = [
    ".", "tools/rbz", "tools/hostkit", "tools/runtime", "src/ph_composer/python", "tests/python", "tools/examples/foundation",
    "tools/githooks",
]

# The pycodestyle/pyflakes core, import order, the modernizations 3.11 makes free, and three
# families carried from the predecessor's review: `BLE` makes a broad `except` a decision,
# `RUF100` keeps a `noqa` from outliving its rule.
[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE",
    # Every parameter and return is annotated, which the type checker relies on and does not require itself.
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
]
# `×` and `−` are the domain's notation (context/UBIQUITOUS_LANGUAGE.md), not typos for x and -.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Spike tooling is outside the type-checked set (tools/spikes/phx_pyodide/README.md).
"tools/spikes/**" = ["ANN"]

# ty, Astral's type checker, pinned exactly while it is in beta. It does not require annotations, so
# ruff's ANN rules above hold every function to typed parameters and returns.
# `root` (where first-party imports resolve) and `include` (what is checked) list the same directories;
# change both together.
[tool.ty.environment]
python-version = "3.11"
root = [
    "src/ph_composer/python", "tools/examples/foundation", "tools/rbz", "tools/hostkit", "tools/runtime", "tests/python",
    "tools/githooks",
]

[tool.ty.src]
include = [
    "src/ph_composer/python", "tools/examples/foundation", "tools/rbz", "tools/hostkit", "tools/runtime", "tests/python",
    "tools/githooks",
]

# A suppression that no longer suppresses anything fails the check, so none outlives its reason.
[tool.ty.rules]
unused-ignore-comment = "error"
