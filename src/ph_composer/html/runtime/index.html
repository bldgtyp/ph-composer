<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Only this server's own files and data. 'unsafe-eval' is for Pyodide's WebAssembly on the Chromium 88
       floor; 'wasm-unsafe-eval' replaces it from Chromium 97, at a floor bump. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; connect-src 'self'; img-src data:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'">
  <title>PH-Composer runtime</title>
  <!-- No favicon request: the browser would ask for /favicon.ico outside the token path. -->
  <link rel="icon" href="data:,">
  <!-- Served only by the extension's loopback asset server (runtime/asset_server.rb), never from a file:
       Pyodide needs the isolation headers that server sends. The panel never loads this page. -->
  <script src="runtime.js"></script>
</head>
<body>
  <p>PH-Composer's Python runtime. This window closes when the run ends.</p>
</body>
</html>
