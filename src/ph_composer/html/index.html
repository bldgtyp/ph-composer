<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PH-Composer</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="overlay.css">
    <link rel="stylesheet" href="shell.css">
    <link rel="stylesheet" href="table.css">
    <link rel="stylesheet" href="zones.css">
  </head>
  <body class="phc-workspace live-panel">
    <div class="phc-app-header">
      <nav class="phc-tabs" aria-label="Sections">
        <button type="button" data-tab="overview">Overview</button>
        <button type="button" disabled>Spaces · Planned</button>
        <button type="button" disabled>Assemblies · Planned</button>
        <button type="button" disabled>Window Types · Planned</button>
        <button type="button" disabled>Thermal Bridges · Planned</button>
        <button type="button" disabled>Systems · Planned</button>
        <button type="button" disabled>Library · Planned</button>
        <button type="button" data-tab="export">Export</button>
      </nav>
      <div class="phc-unit-toggle" role="group" aria-label="Display units">
        <button type="button" data-unit-system="IP" aria-pressed="false" aria-label="Set display units to IP">IP</button>
        <button type="button" data-unit-system="SI" aria-pressed="true" aria-label="Set display units to SI">SI</button>
      </div>
    </div>
    <div class="phc-notice-layer" data-notice-layer></div>
    <main class="panel-panes">
      <div data-pane="overview"></div>
      <div data-pane="export" hidden></div>
    </main>
    <footer class="phc-footer" data-section="footer"></footer>

    <script src="module.js"></script>
    <!-- panel-modules:begin (generated by tools/panel_manifest.js) -->
    <script src="dom.js"></script>
    <script src="fields.js"></script>
    <script src="icons.js"></script>
    <script src="unit_tables.js"></script>
    <script src="unit_numbers.js"></script>
    <script src="length_expression.js"></script>
    <script src="overlay.js"></script>
    <script src="units.js"></script>
    <script src="unit_preferences.js"></script>
    <script src="workspace.js"></script>
    <script src="panel.js"></script>
    <script src="request.js"></script>
    <script src="record_form.js"></script>
    <script src="sections/attached_zone_fields.js"></script>
    <script src="sections/attached_zone_assignment.js"></script>
    <script src="sections/face_words.js"></script>
    <script src="snapshot.js"></script>
    <script src="sections/classify.js"></script>
    <script src="sections/colour_by.js"></script>
    <script src="sections/export.js"></script>
    <script src="view_controls.js"></script>
    <script src="table.js"></script>
    <script src="unit_field.js"></script>
    <script src="sections/overview.js"></script>
    <script src="sections/shell.js"></script>
    <!-- panel-modules:end -->
    <script>
      PhComposerUI.start().panel.ready();
    </script>
  </body>
</html>
