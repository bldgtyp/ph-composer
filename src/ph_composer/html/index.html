<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PH-Composer</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="overlay.css">
    <link rel="stylesheet" href="shell.css">
    <link rel="stylesheet" href="table.css">
    <link rel="stylesheet" href="features/zones/zones.css">
    <link rel="stylesheet" href="library/library.css">
    <link rel="stylesheet" href="features/assemblies/assembly.css">
    <link rel="stylesheet" href="features/windows/windows.css">
  </head>
  <body class="phc-workspace live-panel">
    <div class="phc-app-header">
      <nav class="phc-tabs" aria-label="Sections">
        <button type="button" data-tab="overview">Zones / Faces</button>
        <button type="button" data-tab="assemblies">Assemblies</button>
        <button type="button" data-tab="windows">Window Types</button>
        <button type="button" data-tab="library">Library</button>
        <button type="button" data-tab="export">Export</button>
        <button type="button" disabled title="Planned" aria-label="Spaces, planned">Spaces</button>
        <button type="button" disabled title="Planned" aria-label="Thermal Bridges, planned">Thermal Bridges</button>
        <button type="button" disabled title="Planned" aria-label="Systems, planned">Systems</button>
      </nav>
      <div class="phc-unit-toggle" role="group" aria-label="Display units">
        <button type="button" data-unit-system="IP" aria-pressed="false" aria-label="Set display units to IP">IP</button>
        <button type="button" data-unit-system="SI" aria-pressed="true" aria-label="Set display units to SI">SI</button>
      </div>
    </div>
    <div class="phc-notice-layer" data-notice-layer></div>
    <main class="panel-panes">
      <div data-pane="overview"></div>
      <div data-pane="windows" hidden></div>
      <div data-pane="assemblies" hidden></div>
      <div data-pane="library" hidden></div>
      <div data-pane="export" hidden></div>
    </main>
    <footer class="phc-footer" data-section="footer"></footer>

    <script src="module.js"></script>
    <!-- panel-modules:begin (generated by tools/panel_manifest.js) -->
    <script src="dom.js"></script>
