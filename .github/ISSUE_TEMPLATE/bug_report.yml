name: Report a problem
description: Something in PH-Composer failed or did not do what you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include project names, client details, screenshots or Model files
        unless you are willing to make them public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what PH-Composer did instead.
    validations:
      required: true
  - type: input
    id: incident
    attributes:
      label: Incident reference
      description: The reference shown with Get help, such as PHC-3FA9C1, if there was one.
  - type: textarea
    id: report
    attributes:
      label: Support report
      description: >-
        In SketchUp, open Extensions > PH-Composer > Help & Diagnostics, choose Copy diagnostics,
        review the preview and paste it here. You can attach a saved report instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: SketchUp crash details
      description: If SketchUp itself crashed, the details its crash reporter gave you.
