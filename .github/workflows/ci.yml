name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request supersedes the run in progress; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: make ci (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.7.2 is what SketchUp 2023 embeds, the support floor; 3.2.2 is the current proving
        # host. Ruby 3 keyword separation is invisible to a loop that runs on only one of them.
        ruby-version: ["2.7.2", "3.2.2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          # Installs the `Gemfile.lock` so `make lint` runs rubocop rather than taking its skip
          # path. A skipped linter in CI is a rule that is not enforced.
          bundler-cache: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.33.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      # Same reason as `bundler-cache`: without it `make lint` skips eslint.
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: make ci
        run: make ci RUBY=$(which ruby)
